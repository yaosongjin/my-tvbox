name: auto-update

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests --quiet

      # 点播：抓不到活源时会自己保留旧 ysc.json，不会写空
      - name: update vod
        run: python scripts/update_vod.py

      # 直播：每条源都要做"抓两轮节目单"的终审，比点播慢，单独给足时间。
      # GitHub 的机器在境外，能连上的国内源有限 —— 连不上时只会少几个台，
      # 不会把没验证过的地址写进去；成片率 0 才会保留旧文件（退出码 3）。
      - name: update live
        continue-on-error: true
        env:
          # 一个台有几条能用的源就放几条，写成 TXT 的 `CCTV1,地址1#地址2`，
          # 影视仓读成"一个台 + 多条线路"，列表里仍然只有一行 CCTV1。
          MIN_COVERAGE: '0.5'
        run: python scripts/live.py

      - name: summary
        if: always()
        run: |
          read channels sources cctv wei <<< "$(awk -F',' '
            /#genre#/ {next}
            NF>1 {ch++; n+=split($2,a,"#"); if ($1 ~ /^CCTV/) c++; if ($1 ~ /卫视/) w++}
            END {print ch+0, n+0, c+0, w+0}' live.txt 2>/dev/null)"
          echo "### 本次生成结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项目 | 数量 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 频道数（列表行数） | ${channels:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 播放源总数（线路） | ${sources:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 央视频道 | ${cctv:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 卫视频道 | ${wei:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "直播地址填 live.txt：一个台一行，多条源用 # 连在台名后面，" >> "$GITHUB_STEP_SUMMARY"
          echo "播放时按菜单键 →「线路选择」即可手动切 源1/源2/源3。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "央视数为 0 → 看上一次日志的 [上游检查] 那几行，把失效地址发出来换源。" >> "$GITHUB_STEP_SUMMARY"

      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          # 直播那步失败时可能一个产物都没有，逐个判断，缺的不加也不报错
          for f in ysc.json live.txt live.m3u; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "auto update $(date -u +%F)"
          git push
