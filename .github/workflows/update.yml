name: auto-update

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests --quiet

      # 点播：抓不到活源时会自己保留旧 ysc.json，不会写空
      - name: update vod
        run: python scripts/update_vod.py

      # 直播：每条源都要做"抓两轮节目单"的终审，比点播慢，单独给足时间。
      # GitHub 的机器在境外，能连上的国内源有限 —— 连不上时只会少几个台，
      # 不会把没验证过的地址写进去；成片率 0 才会保留旧文件（退出码 3）。
      - name: update live
        continue-on-error: true
        env:
          PER_CH_LINES: '1'
          MIN_COVERAGE: '0.5'
        run: python scripts/live.py

      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add ysc.json live.m3u
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "auto update $(date -u +%F)"
          git push
