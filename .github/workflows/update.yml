name: auto-update

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests --quiet

      # 点播：抓不到活源时会自己保留旧 ysc.json，不会写空
      - name: update vod
        run: python scripts/update_vod.py

      # 直播：每条源都要做"抓两轮节目单"的终审，比点播慢，单独给足时间。
      # GitHub 的机器在境外，能连上的国内源有限 —— 连不上时只会少几个台，
      # 不会把没验证过的地址写进去；成片率 0 才会保留旧文件（退出码 3）。
      - name: update live
        continue-on-error: true
        env:
          # 每个台给几条线路。播不出画面时影视仓会顺着列表往下走：一个台只有 1 条，
          # 它就只能掉到下一个台（"点 CCTV1 播 CCTV5+" 就是这么来的）。给同一台连着
          # 几条，失败后还在这台里打转，列表里也能自己点「CCTV1 线路2」。
          LINES_CCTV: '4'
          LINES_WS: '3'
          LINES_OTHER: '1'
          MIN_COVERAGE: '0.5'
        run: python scripts/live.py

      - name: summary
        if: always()
        run: |
          lines=$(grep -c '^#EXTINF' live.m3u 2>/dev/null || echo 0)
          channels=$(grep -o 'tvg-id="[^"]*"' live.m3u 2>/dev/null | sort -u | wc -l)
          cctv=$(grep -o 'tvg-id="CCTV[^"]*"' live.m3u 2>/dev/null | sort -u | wc -l)
          wei=$(grep -o 'tvg-id="[^"]*卫视"' live.m3u 2>/dev/null | sort -u | wc -l)
          echo "### 本次生成结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项目 | 数量 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 频道数 | $channels |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 线路总数 | $lines |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 央视频道 | $cctv |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 卫视频道 | $wei |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "央视数为 0 → 看上一次日志的 [上游检查] 那几行，把失效地址发出来换源。" >> "$GITHUB_STEP_SUMMARY"

      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add ysc.json live.m3u
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "auto update $(date -u +%F)"
          git push
