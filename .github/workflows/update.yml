name: auto-update

on:
  schedule:
    # 主时间：UTC 21:30 = 北京次日 05:30
    - cron: '30 21 * * *'
    # 备用时间：UTC 02:25 = 北京 10:25。
    # 2026-11-28 查过：建仓至今 40 条提交里，落在 21:30 UTC 之后窗口的是 0 条，
    # 说明 GitHub 侧的定时触发一次都没兑现（不是配置写错，workflow 状态是 active、
    # 仓库非 fork 未归档、手动 workflow_dispatch 正常）。schedule 官方定义是
    # best-effort，高峰期会延迟或直接丢弃且不留记录。
    # 这条的作用有两个：a) 今天就能验证 schedule 到底能不能通（提交后 30 分钟内见分晓）；
    # b) 长期当兜底，夜里那次被丢了，上午还有一次。跑两次无害（产物覆盖，内容相同）。
    - cron: '10 3 * * *'
  workflow_dispatch:

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 上游从 9 个加到 12 个、候选从 ~1000 条涨到 ~2000 条，测活时间翻倍，
    # 40 分钟不够用（被打断会留下没写完的产物）。给到 55 分钟。
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests --quiet

      # 点播：抓不到活源时会自己保留旧 ysc.json，不会写空
      - name: update vod
        run: python scripts/update_vod.py

      # 直播：每条源都要做"抓两轮节目单"的终审，比点播慢，单独给足时间。
      # GitHub 的机器在境外，能连上的国内源有限 —— 连不上时只会少几个台，
      # 不会把没验证过的地址写进去；成片率 0 才会保留旧文件（退出码 3）。
      - name: update live
        continue-on-error: true
        env:
          # 央视/卫视每个台最多写 6 条线路，写法是 **同一个台名写多行、每行一个地址**
          # （不是 `地址1#地址2` —— `#` 是 URL fragment，播放器会把后面整段丢掉，
          # 只剩第一条生效，这就是"线路选择里只有一个源"的原因）。
          # 影视仓按台名合并成"一个台 + 多条线路"，列表里仍只有一行 CCTV1。
          MIN_COVERAGE: '0.5'
        run: python scripts/live.py

      - name: summary
        if: always()
        run: |
          # live.txt 现在是"一个源一行、台名重复"，所以频道数要按台名去重。
          channels=$(awk -F',' '/#genre#/{next} NF>1 && !s[$1]++ {c++} END{print c+0}' live.txt 2>/dev/null)
          sources=$(awk -F',' '/#genre#/{next} NF>1 {n++} END{print n+0}' live.txt 2>/dev/null)
          cctv=$(awk -F',' '/#genre#/{next} NF>1 && $1 ~ /^CCTV/ && !s[$1]++ {c++} END{print c+0}' live.txt 2>/dev/null)
          wei=$(awk -F',' '/#genre#/{next} NF>1 && $1 ~ /卫视/ && !s[$1]++ {c++} END{print c+0}' live.txt 2>/dev/null)
          multi=$(awk -F',' '/#genre#/{next} NF>1 {if (++m[$1]==2) k++} END{print k+0}' live.txt 2>/dev/null)
          echo "### 本次生成结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项目 | 数量 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 频道数（按台名去重） | ${channels:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 播放源总数 | ${sources:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 其中多个源的台 | ${multi:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 央视频道 | ${cctv:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 卫视频道 | ${wei:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "直播地址填 live.txt：同一个台名写多行、每行一个地址，" >> "$GITHUB_STEP_SUMMARY"
          echo "影视仓会合并成一个台，按菜单键 →「线路选择」就是 源1/源2/源3。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "央视数为 0 → 看上一次日志的 [上游检查] 那几行，把失效地址发出来换源。" >> "$GITHUB_STEP_SUMMARY"

      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          # 直播那步失败时可能一个产物都没有，逐个判断，缺的不加也不报错
          for f in ysc.json live.txt live.m3u; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "auto update $(date -u +%F)"
          git push
