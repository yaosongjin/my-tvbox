name: auto-update

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests --quiet
      - run: python scripts/update_vod.py
      - run: python scripts/live.py
      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add ysc.json live.m3u
          git commit -m "auto update $(date -u +%F)" || exit 0
          git push
